name: Product IA workstream regression

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README*'
  workflow_dispatch:

permissions:
  contents: read

# Isolated GitHub-hosted jobs; never read developer-local API credentials/config.
concurrency:
  group: product-ia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-home-create:
    name: W4 project home and create lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-microhei
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Project home, create, cancel and draft recovery
        run: |
          python -m pytest -q --tb=short \
            tests/test_project_creation_workspace_browser.py \
            tests/test_create_dialog_cancel_browser.py \
            tests/test_create_dialog_persistence_browser.py

  settings-information-architecture:
    name: W5 settings IA and credential safety
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Settings IA and model-config persistence contract
        run: |
          python -m pytest -q --tb=short \
            tests/test_settings_information_architecture_browser.py \
            tests/test_model_config_persistence_contract.py
