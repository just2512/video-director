name: Validate GitHub Actions workflow syntax

on:
  push:
    branches: [main, 'work/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate CI helper shell syntax
        run: bash -n .github/scripts/install-ubuntu-media-deps.sh
      - name: Parse workflow YAML files
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"YAML_PARSE=PASS {path}")
          PY
