name: Studio UI build and browser smoke

# Build and browser-smoke the Studio on the repository's existing self-hosted WSL runner.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/studio-ui-build.yml"
      - "remotion_runtime/**"
      - "studio_ui/**"
      - "webui/static/**"
      - "webui/server.py"
      - "video_director/film_document.py"
      - "video_director/film_scene_runtime.py"
      - "video_director/film_render.py"
      - "video_director/film_watch.py"
      - "video_director/film_mcp_server.py"
      - "video_director/prober.py"
      - "tests/test_film_*.py"
      - "tests/test_studio_build_contract.py"
      - "tools/bootstrap_python_socks.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-ui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    # Same confirmed label contract used by ai-director.yml.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PY311_BIN: /home/actions/miniforge3/envs/py311/bin
      VIDEO_DIRECTOR_REQUIRE_REACT_STUDIO: "1"
    steps:
      # Avoid external checkout/setup action downloads. Restore the exact source
      # revision through the authenticated GitHub archive API using shell tools.
      - name: Recover exact source revision from GitHub archive
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          archive="$RUNNER_TEMP/video-director-${expected}.tar.gz"
          source_tmp="$(mktemp -d "$RUNNER_TEMP/video-director-source.XXXXXX")"
          curl --fail --silent --show-error --location \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 180 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${expected}" \
            -o "$archive"
          tar -xzf "$archive" -C "$source_tmp"
          source_root="$(find "$source_tmp" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          test -f "$source_root/README.md"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a "$source_root"/. "$GITHUB_WORKSPACE"/
          printf '%s\n' "$expected" > "$GITHUB_WORKSPACE/.workflow-source-sha"
          test "$(cat "$GITHUB_WORKSPACE/.workflow-source-sha")" = "$expected"
          echo "Restored exact source revision $expected without external checkout actions."

      - name: Verify preinstalled toolchain
        run: |
          node --version
          npm --version
          test -x "$PY311_BIN/python3.11"
          "$PY311_BIN/python3.11" --version
          "$PY311_BIN/python3.11" -m pip --version

      - name: Typecheck and build React 19 Studio with Tailwind 4
        working-directory: studio_ui
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2
          fi
          test -s package-lock.json
          npm ci --no-audit --no-fund --prefer-offline --fetch-retries=2
          npm run typecheck
          npm run build:studio
          npm run build:studio:css
          test -s ../webui/static/js/film-studio-react.js
          test -s ../webui/static/css/film-studio-tailwind.css
          if grep -q "Build output placeholder" ../webui/static/js/film-studio-react.js; then
            echo "React Studio bundle is still a placeholder" >&2
            exit 1
          fi
          if [ "$(wc -c < ../webui/static/css/film-studio-tailwind.css)" -lt 1000 ]; then
            echo "Tailwind CSS output is unexpectedly small" >&2
            exit 1
          fi

      - name: Bootstrap Python SOCKS support for the self-hosted proxy
        shell: bash
        run: bash tools/bootstrap_python_socks.sh

      - name: Install Remotion render runtime dependencies
        working-directory: remotion_runtime
        shell: bash
        run: npm install --no-package-lock --no-audit --no-fund --prefer-offline --fetch-retries=2

      - name: Install focused Python and Chromium test dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$PY311_BIN/python3.11" -m pip install \
            "pydantic>=2.5" "loguru>=0.7" "edge-tts>=7.0" pillow imageio-ffmpeg \
            openai pyyaml "playwright>=1.40" "pytest>=7.4"
          # The self-hosted WSL image already has Chromium system libraries;
          # only download Playwright's browser binary, avoiding privileged apt work.
          "$PY311_BIN/python3.11" -m playwright install chromium

      - name: Run FilmDocument, migration, and Studio browser regressions
        shell: bash
        run: |
          set -euo pipefail
          "$PY311_BIN/python3.11" -m pytest -q --tb=short \
            tests/test_film_document_contract.py \
            tests/test_film_overwrite_operations.py \
            tests/test_project_context_film_authority.py \
            tests/test_project_manager_film_authority.py \
            tests/test_film_volume_keyframe_migration.py \
            tests/test_film_agent_cli.py \
            tests/test_film_mcp_server.py \
            tests/test_film_full_pipeline_e2e.py \
            tests/test_film_variant_transform_keyframes.py \
            tests/test_film_variant_migration_api.py \
            tests/test_film_mask_overlay_migration.py \
            tests/test_film_external_watch_history.py \
            tests/test_film_external_watch_encoding.py \
            tests/test_film_runtime_mask_keyframes_browser.py \
            tests/test_film_runtime_video_frame_wait.py \
            tests/test_film_scene_runtime.py \
            tests/test_film_render_scene_e2e.py \
            tests/test_film_studio_canvas_history_browser.py \
            tests/test_film_studio_pending_revision.py \
            tests/test_film_studio_roll_browser.py \
            tests/test_film_studio_insert_browser.py \
            tests/test_film_studio_external_watch_browser.py \
            tests/test_film_studio_react_clip_inspector.py \
            tests/test_film_studio_react_fallback.py \
            tests/test_film_studio_react_toolbar.py \
            tests/test_film_studio_react_timeline_toolbar.py \
            tests/test_film_studio_react_ai_director.py \
            tests/test_studio_build_contract.py \
            tests/test_film_studio_inspector_renderer.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in webui/static/js/*.js; do node --check "$file"; done

      - name: Publish built Studio assets without overwriting newer main
        shell: bash
        run: |
          set -euo pipefail
          "$PY311_BIN/python3.11" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          import time
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          paths = [
              "webui/static/js/film-studio-react.js",
              "webui/static/css/film-studio-tailwind.css",
              "studio_ui/package-lock.json",
          ]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "video-director-studio-ci",
          }

          def request(route, method="GET", payload=None):
              url = route if route.startswith("https://") else api + route
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              retryable_statuses = {408, 425, 429, 500, 502, 503, 504}
              max_attempts = 4
              for attempt in range(1, max_attempts + 1):
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      details = exc.read().decode("utf-8", "replace")[:2000]
                      if exc.code in retryable_statuses and attempt < max_attempts:
                          base_delay = min(8, 2 ** (attempt - 1))
                          try:
                              retry_after = float(exc.headers.get("Retry-After", "0"))
                          except (TypeError, ValueError):
                              retry_after = 0
                          delay = max(base_delay, min(15, retry_after))
                          print(f"::warning::GitHub API {method} {route} returned HTTP {exc.code}; retry {attempt + 1}/{max_attempts} in {delay:g}s.")
                          time.sleep(delay)
                          continue
                      raise RuntimeError(f"GitHub API {method} {route}: HTTP {exc.code}: {details}") from exc
                  except (urllib.error.URLError, TimeoutError, ConnectionError, OSError) as exc:
                      if attempt >= max_attempts:
                          raise RuntimeError(f"GitHub API {method} {route} failed after {max_attempts} attempts: {exc}") from exc
                      delay = min(8, 2 ** (attempt - 1))
                      print(f"::warning::Transient GitHub API transport error for {method} {route}: {exc}; retry {attempt + 1}/{max_attempts} in {delay}s.")
                      time.sleep(delay)
              raise RuntimeError(f"GitHub API {method} {route} exhausted retries.")

          current = request(f"/repos/{repo}/commits/main").get("sha")
          if current != expected:
              print(f"::warning::main advanced during build; publication skipped (tested={expected}, current={current}).")
              raise SystemExit(0)

          changed = []
          for path in paths:
              try:
                  remote_file = request(f"/repos/{repo}/contents/{path}?ref=main")
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc):
                      raise
                  remote_file = {}
              built = Path(path).read_bytes()
              blob_sha = hashlib.sha1(
                  b"blob " + str(len(built)).encode("ascii") + bytes([0]) + built
              ).hexdigest()
              if blob_sha == remote_file.get("sha"):
                  continue
              blob = request(f"/repos/{repo}/git/blobs", "POST", {
                  "content": base64.b64encode(built).decode("ascii"),
                  "encoding": "base64",
              })
              changed.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})

          if not changed:
              print("Studio bundle, Tailwind CSS, and dependency lock are already current; no commit created.")
              raise SystemExit(0)

          current_ref = request(f"/repos/{repo}/git/ref/heads/main")
          parent_sha = current_ref["object"]["sha"]
          if parent_sha != expected:
              print(f"::warning::main moved before publication; no update (tested={expected}, current={parent_sha}).")
              raise SystemExit(0)
          parent = request(f"/repos/{repo}/git/commits/{parent_sha}")
          tree = request(f"/repos/{repo}/git/trees", "POST", {
              "base_tree": parent["tree"]["sha"],
              "tree": changed,
          })
          commit = request(f"/repos/{repo}/git/commits", "POST", {
              "message": "build: publish verified React Studio assets",
              "tree": tree["sha"],
              "parents": [parent_sha],
          })
          current_latest = request(f"/repos/{repo}/git/ref/heads/main")["object"]["sha"]
          if current_latest != expected:
              print("::warning::main moved during publication; generated blobs left unreferenced.")
              raise SystemExit(0)
          updated = request(f"/repos/{repo}/git/refs/heads/main", "PATCH", {
              "sha": commit["sha"], "force": False,
          })
          print(f"Published verified Studio assets at {updated['object']['sha']}")
          PY
