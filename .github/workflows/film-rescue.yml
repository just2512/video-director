name: Film refactor one-off verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/film-rescue.yml"
      - "video_director/**"
      - "webui/**"
      - "remotion_runtime/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: write

# Separate from the stalled self-hosted job so this bounded rescue run can execute.
concurrency:
  group: film-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VIDEO_DIRECTOR_TEST_RESULTS: ${{ github.workspace }}/test-results
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Chinese subtitle font
        timeout-minutes: 5
        run: |
          sudo timeout 240s apt-get update -o Acquire::Retries=1 -o Acquire::https::Timeout=20
          sudo timeout 240s apt-get install --no-install-recommends -y ffmpeg fonts-wqy-microhei

      - name: Install Python requirements
        timeout-minutes: 8
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium and system dependencies
        timeout-minutes: 8
        run: python -m playwright install --with-deps chromium

      - name: Compile application and test modules
        run: |
          python -m compileall -q video_director webui tests

      - name: Typecheck React 19 and build the Studio bundle
        working-directory: remotion_runtime
        timeout-minutes: 8
        run: |
          npm install --no-package-lock
          npm run typecheck
          npm run build:studio

      - name: Run full pytest regression
        timeout-minutes: 25
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          timeout --signal=TERM --kill-after=15s 22m python -m pytest -q --tb=short --junitxml=junit.xml > pytest-output.log 2>&1
          result=$?
          set -e
          tail -n 240 pytest-output.log || true
          if [ -f junit.xml ]; then
            python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall(".//testsuite"))
          totals = {name: 0 for name in ("tests", "failures", "errors", "skipped")}
          failures = []
          for suite in suites:
              for name in totals:
                  totals[name] += int(suite.attrib.get(name, "0") or 0)
              for case in suite.findall("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is not None:
                          msg = (node.attrib.get("message") or node.text or "").strip().replace("\\n", " ")
                          failures.append(f"{case.attrib.get('classname','')}::{case.attrib.get('name','')}: {msg[:500]}")
          print("PYTEST_SUMMARY", totals)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write("## Full pytest regression\\n\\n")
                  output.write("\\n".join(f"- {key}: {value}" for key, value in totals.items()) + "\\n\\n")
                  for failure in failures[:100]:
                      output.write(f"- {failure}\\n")
          PY
          fi
          exit "$result"

      - name: Check browser JavaScript syntax
        if: always()
        run: |
          for file in webui/static/js/*.js; do node --check "$file"; done
          for file in $(find third_party/huashu-art-motion/clip -name '*.js'); do node --check "$file"; done
          node --check third_party/huashu/huashu_motion_bundle.js

      - name: Publish React Studio bundle only after a clean test run
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s webui/static/js/film-studio-react.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/static/js/film-studio-react.js
          if git diff --cached --quiet; then
            echo "Generated React bundle is already checked in."
            exit 0
          fi
          git commit -m "build: publish verified React 19 Studio bundle"
          git push origin HEAD:main

      - name: Retain small text reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: film-rescue-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            junit.xml
            pytest-output.log
