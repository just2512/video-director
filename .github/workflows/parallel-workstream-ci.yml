name: Parallel workstream regression

on:
  push:
    branches:
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Each workstream gets its own hosted runner and isolated workspace.
# Do not reuse the self-hosted WSL runner used by the full integration suite.
concurrency:
  group: parallel-workstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system media dependencies
        if: startsWith(github.ref_name, 'work/timeline-state') || startsWith(github.ref_name, 'work/timeline-gesture-integration') || startsWith(github.ref_name, 'work/timeline-gesture-state') || startsWith(github.ref_name, 'work/timeline-gesture-integration') || startsWith(github.ref_name, 'work/asset-insert-revision') || startsWith(github.ref_name, 'work/lifecycle-e2e') || startsWith(github.ref_name, 'work/film-four-way-consistency') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/film-four-way-consistency')) || startsWith(github.ref_name, 'work/film-four-way-consistency-main-sync')
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-microhei
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
      - name: Install Chromium
        if: startsWith(github.ref_name, 'work/timeline-state') || startsWith(github.ref_name, 'work/timeline-gesture-state') || startsWith(github.ref_name, 'work/timeline-gesture-integration') || startsWith(github.ref_name, 'work/asset-insert-revision') || startsWith(github.ref_name, 'work/lifecycle-e2e') || startsWith(github.ref_name, 'work/film-four-way-consistency') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/film-four-way-consistency')) || startsWith(github.ref_name, 'work/film-four-way-consistency-main-sync')
        run: python -m playwright install --with-deps chromium
      - name: Generation error classification safety
        if: startsWith(github.ref_name, 'work/generation-error-classification')
        run: |
          python -m pytest -q tests/test_generation_recovery.py \
            -k "explicit_submission_unknown or ambiguous_transport_failure"
      - name: Generation state and crash recovery
        if: startsWith(github.ref_name, 'work/generation-state')
        run: |
          python -m pytest -q \
            tests/test_generation_recovery.py \
            tests/test_generation_gap1.py \
            tests/test_film_transaction_recovery.py \
            tests/test_project_manifest.py \
            tests/test_bulk_management.py
      - name: Timeline editing and revision consistency
        if: startsWith(github.ref_name, 'work/timeline-state') || startsWith(github.ref_name, 'work/timeline-gesture-integration')
        run: |
          python -m pytest -q \
            tests/test_editor_undo_redo.py \
            tests/test_film_studio_timeline_history_browser.py \
            tests/test_film_studio_pending_revision.py \
            tests/test_film_studio_external_watch_browser.py \
            tests/test_editor_command_project_switch_browser.py \
            tests/test_visual_overlay_timeline.py \
            tests/test_audio_clip_timeline.py \
            tests/test_film_document_contract.py \
            tests/test_film_external_watch_history.py \
            tests/test_film_transaction_recovery.py
      - name: Film Studio four-way browser acceptance
        if: startsWith(github.ref_name, 'work/asset-insert-revision') || startsWith(github.ref_name, 'work/film-four-way-consistency') || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'work/film-four-way-consistency')) || startsWith(github.ref_name, 'work/film-four-way-consistency-main-sync')
        run: |
          python -m pytest -q \
            tests/test_film_studio_insert_browser.py \
            tests/test_film_studio_roll_browser.py \
            tests/test_film_studio_timeline_history_browser.py \
            tests/test_film_studio_pending_revision.py \
            tests/test_film_studio_external_watch_browser.py \
            tests/test_film_studio_project_switch_four_way_browser.py \
            tests/test_editor_command_project_switch_browser.py \
            tests/test_editor_preview_review_project_switch_browser.py \
            tests/test_film_document_contract.py \
            tests/test_film_transaction_recovery.py
      - name: Project lifecycle end-to-end
        if: startsWith(github.ref_name, 'work/lifecycle-e2e')
        run: |
          python -m pytest -q \
            tests/test_project_manager.py \
            tests/test_project_manager_film_authority.py \
            tests/test_film_full_pipeline_e2e.py \
            tests/test_film_studio_migration_preview_browser.py \
            tests/test_film_render_publication_transaction.py \
            tests/test_film_render_scene_e2e.py \
            tests/test_film_document_contract.py \
            tests/test_film_studio_generated_asset_adoption_browser.py
