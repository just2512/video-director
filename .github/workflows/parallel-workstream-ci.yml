name: Parallel workstream regression

on:
  push:
    branches: [main, 'work/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'README*'
  workflow_dispatch:

permissions:
  contents: read

# Independent GitHub-hosted jobs; every job checks out the same immutable SHA.
concurrency:
  group: parallel-workstreams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-durability:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/work/w1-')
    name: W1 generation durability
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Generation recovery and manifest invariants
        run: |
          python -m pytest -q --tb=short \
            tests/test_generation_recovery.py \
            tests/test_generation_gap1.py \
            tests/test_film_transaction_recovery.py \
            tests/test_project_manifest.py \
            tests/test_bulk_management.py

  timeline-transactions:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/work/w2-')
    name: W2 timeline transactions
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VIDEO_DIRECTOR_REQUIRE_REACT_STUDIO: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio_ui/package-lock.json
      - name: Build the React 19 Studio used by timeline browser tests
        working-directory: studio_ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:studio
          npm run build:studio:css
          test -s ../webui/static/js/film-studio-react.js
          test -s ../webui/static/css/film-studio-tailwind.css
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-microhei
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Timeline transaction and revision regression
        run: |
          python -m pytest -q --tb=short \
            tests/test_editor_undo_redo.py \
            tests/test_film_studio_timeline_history_browser.py \
            tests/test_film_studio_canvas_history_browser.py \
            tests/test_film_studio_pending_revision.py \
            tests/test_film_studio_external_watch_browser.py \
            tests/test_editor_command_project_switch_browser.py \
            tests/test_visual_overlay_timeline.py \
            tests/test_audio_clip_timeline.py \
            tests/test_film_document_contract.py \
            tests/test_film_timeline_markers.py \
            tests/test_film_clip_lock.py \
            tests/test_film_external_watch_history.py \
            tests/test_film_transaction_recovery.py \
            tests/test_film_studio_ai_proposal_browser.py \
            tests/test_film_studio_ai_stream_contract.py \
            tests/test_film_studio_roll_browser.py

  lifecycle-export:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/work/w3-')
    name: W3 lifecycle export and QC
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install browser and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-wqy-microhei
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Project lifecycle, render and QC regression
        run: |
          python -m pytest -q --tb=short \
            tests/test_project_manager.py \
            tests/test_project_manager_film_authority.py \
            tests/test_film_full_pipeline_e2e.py \
            tests/test_film_studio_migration_preview_browser.py \
            tests/test_film_render_publication_transaction.py \
            tests/test_film_render_scene_e2e.py \
            tests/test_film_scene_runtime.py \
            tests/test_film_runtime_video_frame_wait.py \
            tests/test_film_document_contract.py \
            tests/test_film_studio_generated_asset_adoption_browser.py \
            tests/test_asset_catalog.py \
            tests/test_film_variant_migration_api.py

  shell-navigation:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/work/w7-')
    name: W7 shared shell navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Verify top-level route and shared-shell behavior
        run: |
          python -m pytest -q --tb=short tests/test_product_shell_navigation_browser.py
