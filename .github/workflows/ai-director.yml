name: AI Director regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ai-director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install chromium
      - run: python -m compileall video_director webui
      - run: pytest -q
      - run: |
          for f in webui/static/js/*.js third_party/huashu-art-motion/clip/lib/*.js third_party/huashu-art-motion/clip/clips/*.js; do
            node --check "$f"
          done
