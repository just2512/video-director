name: AI Director regression

on:
  workflow_dispatch:
    inputs:
      run_live_llm:
        description: "Run a real configured provider token-stream smoke test (may incur provider cost)"
        required: true
        type: boolean
        default: false
      live_model_override:
        description: "Optional model ID override for the isolated live token-stream smoke; does not change stored runner config"
        required: false
        type: string
        default: ""
      live_provider_override:
        description: "Optional provider for the isolated live smoke; currently supports nvidia and does not change stored runner config"
        required: false
        type: string
        default: ""
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/unified-director-agent-loop"]

# Both workflows execute on the same self-hosted runner host and share its checkout.
# Serialize them across workflow names: different concurrency groups allowed one job
# to clean/recover the shared worktree while the other was running browser tests.
permissions:
  contents: write

concurrency:
  group: video-director-self-hosted-${{ github.repository }}
  # Only an explicitly tagged push may cancel a stale job holding the shared runner.
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[unblock-runner]') }}

jobs:
  ai-director:
    timeout-minutes: 45
    # Self-hosted runner: WSL2 Ubuntu on the local Windows machine
    # (D:\WSL\Ubuntu). Kept online by the WSLUbuntuKeepAlive scheduled task.
    runs-on: [self-hosted, linux, x64]
    # Browser traces must land inside the workspace so upload-artifact actually
    # retains them; pytest's per-test tmp_path lives outside the upload globs.
    env:
      VIDEO_DIRECTOR_TEST_RESULTS: ${{ github.workspace }}/test-results
      # Python 3.11 is preinstalled on the runner image via Miniforge
      # (conda env py311), because setup-python's GitHub-hosted tarball
      # download is unreliable over the local network. Everything python
      # goes through this interpreter.
      PY311_BIN: /home/actions/miniforge3/envs/py311/bin
      VIDEO_DIRECTOR_REQUIRE_REACT_STUDIO: "1"
    steps:
      # This self-hosted WSL runner has intermittently lost GitHub TLS streams
      # during checkout. Force HTTP/1.1 before checkout instead of allowing Git
      # to negotiate the flaky transport path; this does not alter app/runtime traffic.
      - name: Configure Git transport for the self-hosted runner
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          git config --global --get http.version
      # Do not use actions/checkout here: the self-hosted runner's
      # action-download endpoint intermittently times out before any shell step.
      # The following step restores the exact immutable GITHUB_SHA via Git or
      # the authenticated GitHub archive API, and also rejects stale workspace files.
      - name: Defer checkout to exact-revision recovery
        id: checkout
        shell: bash
        run: |
          echo "source_mode=deferred" >> "$GITHUB_OUTPUT"
          echo "Source will be recovered from exact GITHUB_SHA without external actions."
      - name: Verify and recover exact source revision
        id: ensure_checkout
        if: always()
        timeout-minutes: 8
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          workspace="$GITHUB_WORKSPACE"

          # Preserve only the private model configuration before cleaning the shared checkout.
          # git clean -ffdx removes ignored storage/composer data, where the app persists
          # model_config.json by default. Never print the config or copy project media.
          # The app's default local config can live either in the shared Actions
          # checkout or in the developer checkout mounted into this WSL runner.
          # Probe only known storage roots; never print config contents or keys.
          candidate_roots=()
          if [ -n "${VIDEO_DIRECTOR_STORAGE_ROOT:-}" ]; then
            candidate_roots+=("$VIDEO_DIRECTOR_STORAGE_ROOT")
          fi
          candidate_roots+=("$workspace/storage/composer" "/mnt/d/autocut/video-director/storage/composer")
          shopt -s nullglob
          worktree_roots=(/mnt/d/autocut/video-director/.claude/worktrees/*/storage/composer)
          shopt -u nullglob
          candidate_roots+=("${worktree_roots[@]}")

          # Prefer a config with a non-empty llm key; a blank UI placeholder in
          # one checkout must not mask the user's actual configured worktree.
          configured_root=""
          for candidate_root in "${candidate_roots[@]}"; do
            if [ ! -f "$candidate_root/model_config.json" ]; then
              continue
            fi
            if "$PY311_BIN/python3.11" - "$candidate_root/model_config.json" >/dev/null 2>&1 <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  data = json.load(stream)
              key = (data.get("llm") or {}).get("api_key") if isinstance(data, dict) else ""
          except Exception:
              key = ""
          raise SystemExit(0 if isinstance(key, str) and key.strip() else 1)
          PY
            then
              configured_root="$candidate_root"
              break
            fi
          done
          if [ -n "$configured_root" ]; then
            # Copy only the valid model config to a private per-run directory.
            # This survives git clean/archive recovery without carrying project media.
            preserved_root="$RUNNER_TEMP/video-director-preserved-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/composer"
            install -d -m 700 "$preserved_root"
            install -m 600 "$configured_root/model_config.json" "$preserved_root/model_config.json"
            printf 'VD_PRESERVED_MODEL_CONFIG_FILE=%s\n' "$preserved_root/model_config.json" >> "$GITHUB_ENV"
            echo "Preserved the runner's configured LLM role for the isolated live test only."
          else
            echo "No model_config.json with a non-empty llm key found in configured runner storage roots."
          fi

          if git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ "$(git rev-parse HEAD 2>/dev/null || true)" = "$expected" ]; then
            git reset --hard "$expected"
            git clean -ffdx
            echo "source_mode=git" >> "$GITHUB_OUTPUT"
            echo "Verified source revision from Git: $expected"
            exit 0
          fi

          # Shared self-hosted workspaces may have had .git removed by another workflow.
          # Initialize a local object store before attempting the bounded Git fetch; do not
          # depend on the archive endpoint's redirect to codeload.github.com.
          if ! git -C "$workspace" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$workspace" init
          fi

          # First prefer a normal Git object so later local Git operations work.
          if git -C "$workspace" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            recovered=false
            for attempt in 1 2 3; do
              echo "Recovering exact workflow revision with bounded Git fetch (attempt $attempt/3)."
              if timeout 35s git -C "$workspace" -c http.version=HTTP/1.1 fetch --no-tags --depth=1 \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$expected"; then
                # Fetch is the point of no return for old workspace data. Remove stale
                # files before checkout so untracked files cannot block an exact revision.
                git -C "$workspace" clean -ffdx
                git -C "$workspace" checkout --force --detach FETCH_HEAD
                recovered=true
                break
              fi
              sleep "$((attempt * 2))"
            done
            if [ "$recovered" = true ] && [ "$(git rev-parse HEAD)" = "$expected" ]; then
              git reset --hard "$expected"
              git clean -ffdx
              echo "source_mode=git" >> "$GITHUB_OUTPUT"
              echo "Verified source revision from Git recovery: $expected"
              exit 0
            fi
          fi

          # Git/TLS failures must not prevent tests from running when the exact
          # immutable GitHub archive is still reachable. The bundle publisher uses
          # the REST API and therefore does not depend on this worktree's Git history.
          archive="$RUNNER_TEMP/video-director-${expected}.tar.gz"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GITHUB_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail --silent --show-error --location \
            --retry 2 --retry-all-errors --connect-timeout 15 --max-time 180 \
            "${headers[@]}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${expected}" \
            -o "$archive"
          source_tmp="$(mktemp -d "$RUNNER_TEMP/video-director-source.XXXXXX")"
          tar -xzf "$archive" -C "$source_tmp"
          source_root="$(find "$source_tmp" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$source_root"
          test -f "$source_root/README.md"
          # Preserve .git only when present; replace all tracked/untracked workspace
          # files so stale files from a previous job cannot enter the test run.
          find "$workspace" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$source_root"/. "$workspace"/
          printf '%s\n' "$expected" > "$workspace/.workflow-source-sha"
          echo "source_mode=archive" >> "$GITHUB_OUTPUT"
          echo "Verified immutable source archive for revision: $expected"
      - name: Verify pinned Python 3.11 interpreter
        if: steps.ensure_checkout.outcome == 'success'
        run: |
          "$PY311_BIN/python3.11" --version
          "$PY311_BIN/python3.11" -m pip --version
      - name: Bootstrap Python SOCKS support for the self-hosted proxy
        if: steps.ensure_checkout.outcome == 'success'
        shell: bash
        run: bash tools/bootstrap_python_socks.sh
      - run: '"$PY311_BIN/python3.11" -m pip install --upgrade pip'
        if: steps.ensure_checkout.outcome == 'success'
      - run: '"$PY311_BIN/python3.11" -m pip install -r requirements.txt'
        if: steps.ensure_checkout.outcome == 'success'
      - name: Ensure FFmpeg and the Chinese subtitle font
        if: steps.ensure_checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          if ! command -v fc-list >/dev/null 2>&1 || ! fc-list : family | grep -Eiq 'WenQuanYi Micro Hei'; then
            missing+=(fonts-wqy-microhei)
          fi
          if (("${#missing[@]}")); then
            # Bound network stalls before the test suite. Do not silently continue
            # if a required render dependency is genuinely absent.
            sudo timeout 120s apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
            # FFmpeg pulls a large codec dependency graph on Ubuntu 24.04.
            # Skip recommended packages and allow a bounded but realistic download window.
            sudo timeout 480s apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 install --no-install-recommends -y "${missing[@]}"
          else
            echo "FFmpeg and WenQuanYi Micro Hei are already installed; skipping apt network access."
          fi
      # Chromium browser binaries live in the actions user's Playwright cache
      # (~/.cache/ms-playwright); system .so deps are preinstalled on the
      # runner image. Browser-only download keeps this step unprivileged.
      - run: '"$PY311_BIN/python3.11" -m playwright install chromium'
        if: steps.ensure_checkout.outcome == 'success'
      - run: '"$PY311_BIN/python3.11" -m compileall video_director webui'
        if: steps.ensure_checkout.outcome == 'success'
      - name: Compile all test modules before pytest collection
        if: steps.ensure_checkout.outcome == 'success'
        run: '"$PY311_BIN/python3.11" -m compileall -q tests'
      - name: Configure opt-in live model token-stream smoke
        id: live_stream_config
        # Live-provider acceptance is opt-in. Keep credentials out of GITHUB_ENV:
        # the real provider test runs in a dedicated child process, not in broad pytest.
        if: (github.event_name == 'workflow_dispatch' && inputs.run_live_llm) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-stream-smoke]'))
        shell: bash
        continue-on-error: true
        env:
          VD_LLM_API_KEY_SECRET: ${{ secrets.VD_LLM_API_KEY }}
          VD_LLM_BASE_URL_CONFIG: ${{ vars.VD_LLM_BASE_URL }}
          VD_LLM_MODEL_CONFIG: ${{ vars.VD_LLM_MODEL }}
          VD_LLM_MODEL_OVERRIDE: ${{ github.event.inputs.live_model_override || '' }}
          VD_LLM_PROVIDER_OVERRIDE: ${{ github.event.inputs.live_provider_override || '' }}
          NVIDIA_API_KEY_SECRET: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          live_config="$RUNNER_TEMP/video-director-live-llm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          "$PY311_BIN/python3.11" - "$live_config" <<'PY'
          import json
          import os
          import stat
          import sys
          from video_director.live_stream_acceptance import resolve_live_model, resolve_live_model_override, resolve_live_provider_override

          path = sys.argv[1]
          saved = {}
          preserved = os.environ.get("VD_PRESERVED_MODEL_CONFIG_FILE", "").strip()
          if preserved and os.path.isfile(preserved):
              try:
                  with open(preserved, encoding="utf-8") as stream:
                      data = json.load(stream)
                  candidate = data.get("llm", {}) if isinstance(data, dict) else {}
                  if isinstance(candidate, dict):
                      saved = candidate
              except (OSError, json.JSONDecodeError):
                  saved = {}

          api_key = (os.environ.get("NVIDIA_API_KEY_SECRET") or os.environ.get("NVIDIA_API_KEY") or os.environ.get("VD_LLM_API_KEY_SECRET") or saved.get("api_key") or "").strip()
          base_url = (
              os.environ.get("VD_LLM_BASE_URL_CONFIG")
              or saved.get("base_url")
              or "https://api.openai.com/v1"
          ).strip()
          configured_model = (
              os.environ.get("VD_LLM_MODEL_CONFIG")
              or saved.get("model")
              or "gpt-4o-mini"
          ).strip()
          event_payload = {}
          try:
              event_path = os.environ.get("GITHUB_EVENT_PATH", "").strip()
              if event_path:
                  with open(event_path, encoding="utf-8") as stream:
                      event_payload = json.load(stream)
          except (OSError, json.JSONDecodeError):
              event_payload = {}
          commit_message = (event_payload.get("head_commit") or {}).get("message", "") if isinstance(event_payload, dict) else ""
          try:
              provider_override = resolve_live_provider_override(os.environ.get("VD_LLM_PROVIDER_OVERRIDE", ""), commit_message)
          except ValueError as error:
              print(f"::error::Invalid one-run live provider override: {error}")
              raise SystemExit(1)
          if provider_override == "nvidia":
              base_url = "https://integrate.api.nvidia.com/v1"
              print("Using NVIDIA official OpenAI-compatible endpoint for this isolated run; stored provider settings remain unchanged.")
          try:
              model_override = resolve_live_model_override(os.environ.get("VD_LLM_MODEL_OVERRIDE", ""), commit_message)
          except ValueError as error:
              print(f"::error::Invalid one-run live model override: {error}")
              raise SystemExit(1)
          model = resolve_live_model(model_override or configured_model, base_url)
          if model_override:
              print("Using the explicitly supplied model ID override for this isolated run; stored configuration remains unchanged.")
          elif model != configured_model:
              print("Detected the retired OpenRouter GLM-5.3 model ID on the official OpenRouter endpoint; using the GLM Latest alias for this isolated run. Stored configuration remains unchanged.")
          elif configured_model == "z-ai/glm-5.3":
              print("::warning::The configured model ID is retired, but this is not the official OpenRouter endpoint. Supply live_model_override with a model ID supported by this gateway; saved configuration remains unchanged.")
          if not api_key or not base_url or not model:
              print("::error::Opt-in live-model smoke is missing a complete key/base URL/model configuration.")
              raise SystemExit(1)

          with open(path, "w", encoding="utf-8") as stream:
              json.dump({"api_key": api_key, "base_url": base_url, "model": model}, stream)
          os.chmod(path, stat.S_IRUSR | stat.S_IWUSR)
          print("Prepared private per-run model config for the isolated live test; credentials were not exported or printed.")
          PY
          printf 'VD_LLM_LIVE_CONFIG_FILE=%s\n' "$live_config" >> "$GITHUB_ENV"

      - name: Run isolated real-model token-stream acceptance test
        id: live_stream_smoke
        if: steps.live_stream_config.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 6m "$PY311_BIN/python3.11" - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          config_path = Path(os.environ["VD_LLM_LIVE_CONFIG_FILE"])
          result = None
          try:
              with config_path.open(encoding="utf-8") as stream:
                  config = json.load(stream)
              test_env = os.environ.copy()
              # Strip credentials and local model storage from this wrapper first,
              # then inject them only into the one pytest subprocess that calls the provider.
              for key in (
                  "VD_LLM_API_KEY", "VD_LLM_BASE_URL", "VD_LLM_MODEL",
                  "VD_LLM_LIVE_STREAM_TEST", "VD_LLM_REQUEST_TIMEOUT_SECONDS",
                  "VD_LLM_MAX_RETRIES", "VIDEO_DIRECTOR_STORAGE_ROOT",
              ):
                  test_env.pop(key, None)
              test_env.update({
                  "VD_LLM_API_KEY": config["api_key"],
                  "VD_LLM_BASE_URL": config["base_url"],
                  "VD_LLM_MODEL": config["model"],
                  "VD_LLM_LIVE_STREAM_TEST": "1",
                  "VD_LLM_REQUEST_TIMEOUT_SECONDS": "240",
                  "VD_LLM_MAX_RETRIES": "0",
              })
              command = [
                  sys.executable, "-m", "pytest", "-q", "--tb=short",
                  "--junitxml=live-stream-junit.xml",
                  "tests/test_film_studio_live_ai_streaming.py::test_configured_film_ai_stream_delivers_tokens_before_result_without_writing_film",
              ]
              result = subprocess.run(command, env=test_env, check=False)
          finally:
              try:
                  config_path.unlink()
              except FileNotFoundError:
                  pass
          raise SystemExit(result.returncode if result is not None else 1)
          PY

      - name: Install Remotion rendering runtime dependencies
        if: always() && steps.ensure_checkout.outcome == 'success'
        working-directory: remotion_runtime
        run: npm install --no-package-lock --no-audit --no-fund --prefer-offline --fetch-retries=2

      - name: Typecheck React 19 / TypeScript render and timeline contracts
        id: react_typecheck
        if: always() && steps.ensure_checkout.outcome == 'success'
        working-directory: studio_ui
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-retries=2
          fi
          test -s package-lock.json
          npm ci --no-audit --no-fund --prefer-offline --fetch-retries=2
          npm run typecheck

      - name: Build the React 19 Studio canvas inspector
        id: react_build
        if: always() && steps.ensure_checkout.outcome == 'success'
        working-directory: studio_ui
        run: npm run build:studio

      - name: Build scoped Tailwind 4 CSS for React Studio
        id: tailwind_build
        if: always() && steps.ensure_checkout.outcome == 'success'
        working-directory: studio_ui
        run: npm run build:studio:css
      - name: Run React Studio integration smoke tests
        id: react_smoke
        if: always() && steps.ensure_checkout.outcome == 'success' && steps.react_typecheck.outcome == 'success' && steps.react_build.outcome == 'success' && steps.tailwind_build.outcome == 'success'
        run: |
          "$PY311_BIN/python3.11" -m pytest -q \
            tests/test_film_studio_canvas_history_browser.py \
            tests/test_film_studio_react_clip_inspector.py \
            tests/test_film_studio_react_fallback.py \
            tests/test_film_studio_inspector_renderer.py \
            tests/test_film_runtime_mask_keyframes_browser.py \
            tests/test_film_mask_overlay_migration.py \
            tests/test_film_variant_transform_keyframes.py \
            tests/test_film_registered_style_migration.py
      - name: Run test suite and retain JUnit report
        id: full_regression
        if: always() && steps.ensure_checkout.outcome == 'success'
        shell: bash
        run: |
          set +e
          env -u VD_LLM_API_KEY -u VD_LLM_BASE_URL -u VD_LLM_MODEL \
            -u VD_LLM_LIVE_STREAM_TEST -u VD_LLM_REQUEST_TIMEOUT_SECONDS -u VD_LLM_MAX_RETRIES \
            -u VIDEO_DIRECTOR_STORAGE_ROOT -u OPENAI_API_KEY -u ANTHROPIC_API_KEY \
            timeout --signal=TERM --kill-after=15s 22m "$PY311_BIN/python3.11" -m pytest -q --tb=short --junitxml=junit.xml > pytest-output.log 2>&1
          test_exit=$?
          set -e
          if [ -f pytest-output.log ]; then
            echo "---- pytest output (last 240 lines) ----"
            tail -n 240 pytest-output.log
          fi
          if [ -f junit.xml ]; then
            "$PY311_BIN/python3.11" - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall(".//testsuite"))
          failures, errors = [], []
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, "0") or 0)
              for case in suite.findall("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is not None:
                          message = (node.attrib.get("message") or "").strip().replace("\n", " ")
                          trace = (node.text or "").strip().replace("\n", " ")
                          record = f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}: {message[:350]} [trace: {trace[-1200:]}]"
                          (failures if kind == "failure" else errors).append(record)
          print("PYTEST_SUMMARY " + str(totals))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("## Pytest regression summary\n\n")
                  out.write(f"- Tests: {totals['tests']}\n- Failures: {totals['failures']}\n- Errors: {totals['errors']}\n- Skipped: {totals['skipped']}\n\n")
                  for title, rows in (("Failures", failures), ("Errors", errors)):
                      if rows:
                          out.write(f"### {title}\n")
                          for row in rows[:100]:
                              out.write(f"- `{row}`\n")
                          out.write("\n")
          for title, rows in (("FAILURE", failures), ("ERROR", errors)):
              for row in rows:
                  print(f"PYTEST_{title}: {row}")
          PY
          fi
          exit "$test_exit"
      - name: Report real-model token-stream acceptance gate
        id: live_stream_acceptance
        if: always() && steps.ensure_checkout.outcome == 'success'
        shell: bash
        env:
          LIVE_STREAM_CONFIG_OUTCOME: ${{ steps.live_stream_config.outcome }}
          LIVE_STREAM_TEST_OUTCOME: ${{ steps.live_stream_smoke.outcome }}
        run: |
          set -euo pipefail
          "$PY311_BIN/python3.11" -m video_director.live_stream_acceptance --junit live-stream-junit.xml

      - name: Check JavaScript syntax (run even when tests fail)
        id: js_syntax
        if: always() && steps.ensure_checkout.outcome == 'success'
        run: |
          for f in webui/static/js/*.js; do
            node --check "$f"
          done
          for f in $(find third_party/huashu-art-motion/clip -name '*.js'); do
            node --check "$f"
          done
          node --check third_party/huashu/huashu_motion_bundle.js


      # The browser serves the checked-in bundle, not an ephemeral build directory.
      # Publication requires real gesture/undo, insert/roll, stale-revision, watcher,
      # CLI/MCP, scene-frame and render/export regressions as well as the React build.
      # The broad suite remains visible separately; failures in this curated release gate block publication.
      # A GitHub-token push intentionally does not fan out another workflow run.
      - name: Gate Studio asset publication on timeline browser regressions
        id: timeline_regression_gate
        if: always() && steps.ensure_checkout.outcome == 'success' && steps.react_typecheck.outcome == 'success' && steps.react_build.outcome == 'success' && steps.tailwind_build.outcome == 'success' && steps.react_smoke.outcome == 'success' && steps.js_syntax.outcome == 'success' && steps.live_stream_acceptance.conclusion == 'success' && (steps.live_stream_config.conclusion == 'success' || steps.live_stream_config.conclusion == 'skipped' || steps.live_stream_config.conclusion == 'failure')
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 12m "$PY311_BIN/python3.11" -m pytest -q --tb=short \
            --junitxml=timeline-junit.xml \
            tests/test_film_document_contract.py \
            tests/test_film_studio_external_watch_browser.py \
            tests/test_film_studio_migration_preview_browser.py \
            tests/test_film_studio_layout_persistence_browser.py \
            tests/test_film_variant_migration_api.py \
            tests/test_film_studio_ai_proposal_browser.py \
            tests/test_film_studio_react_timeline_toolbar.py \
            tests/test_film_studio_react_toolbar.py \
            tests/test_film_agent_cli.py \
            tests/test_film_mcp_server.py \
            tests/test_film_full_pipeline_e2e.py \
            tests/test_film_render_scene_e2e.py \
            tests/test_film_runtime_video_frame_wait.py \
            tests/test_film_scene_runtime.py \
            tests/test_film_studio_canvas_history_browser.py \
            tests/test_film_studio_timeline_history_browser.py \
            tests/test_film_studio_pending_revision.py \
            tests/test_film_studio_roll_browser.py \
            tests/test_film_studio_insert_browser.py \
            tests/test_film_external_watch_history.py \
            tests/test_film_variant_transform_keyframes.py \
            tests/test_film_volume_keyframe_migration.py \
            tests/test_film_runtime_mask_keyframes_browser.py \
            tests/test_studio_build_contract.py > timeline-regression-output.log 2>&1
          test_exit=$?
          set -e
          if [ -f timeline-regression-output.log ]; then
            echo "---- focused timeline/export regression output (last 240 lines) ----"
            tail -n 240 timeline-regression-output.log
          fi
          exit "$test_exit"

      # Runner SOCKS proxy URLs are not accepted by the Node artifact uploader.
      # Failure details remain in Actions logs/summary; archive upload is optional.
      - name: Retain regression diagnostics
        if: always() && steps.ensure_checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            junit.xml
            pytest-output.log
            live-stream-junit.xml
            timeline-junit.xml
            timeline-regression-output.log
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish verified React Studio bundle and Tailwind CSS to main
        if: always() && steps.ensure_checkout.outcome == 'success' && steps.full_regression.outcome == 'success' && steps.react_typecheck.outcome == 'success' && steps.react_build.outcome == 'success' && steps.tailwind_build.outcome == 'success' && steps.react_smoke.outcome == 'success' && steps.js_syntax.outcome == 'success' && steps.live_stream_acceptance.conclusion == 'success' && (steps.live_stream_config.conclusion == 'success' || steps.live_stream_config.conclusion == 'skipped' || steps.live_stream_config.conclusion == 'failure') && steps.timeline_regression_gate.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s webui/static/js/film-studio-react.js
          test -s webui/static/css/film-studio-tailwind.css
          "$PY311_BIN/python3.11" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          import time
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          paths = [
              "webui/static/js/film-studio-react.js",
              "webui/static/css/film-studio-tailwind.css",
              "studio_ui/package-lock.json",
          ]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "video-director-ci",
          }

          def request(route, method="GET", payload=None):
              url = route if route.startswith("https://") else api + route
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              retryable_statuses = {408, 425, 429, 500, 502, 503, 504}
              max_attempts = 4
              for attempt in range(1, max_attempts + 1):
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      details = exc.read().decode("utf-8", "replace")[:2000]
                      if exc.code in retryable_statuses and attempt < max_attempts:
                          base_delay = min(8, 2 ** (attempt - 1))
                          try:
                              retry_after = float(exc.headers.get("Retry-After", "0"))
                          except (TypeError, ValueError):
                              retry_after = 0
                          delay = max(base_delay, min(15, retry_after))
                          print(f"::warning::GitHub API {method} {route} returned HTTP {exc.code}; retry {attempt + 1}/{max_attempts} in {delay:g}s.")
                          time.sleep(delay)
                          continue
                      raise RuntimeError(f"GitHub API {method} {route}: HTTP {exc.code}: {details}") from exc
                  except (urllib.error.URLError, TimeoutError, ConnectionError, OSError) as exc:
                      if attempt >= max_attempts:
                          raise RuntimeError(f"GitHub API {method} {route} failed after {max_attempts} attempts: {exc}") from exc
                      delay = min(8, 2 ** (attempt - 1))
                      print(f"::warning::Transient GitHub API transport error for {method} {route}: {exc}; retry {attempt + 1}/{max_attempts} in {delay}s.")
                      time.sleep(delay)
              raise RuntimeError(f"GitHub API {method} {route} exhausted retries.")

          current = request(f"/repos/{repo}/commits/main").get("sha")
          if current != expected:
              print(f"::warning::main advanced while tests ran; bundle publish skipped (tested={expected}, current={current}).")
              sys.exit(0)

          changed = []
          for path in paths:
              try:
                  remote_file = request(f"/repos/{repo}/contents/{path}?ref=main")
              except RuntimeError as exc:
                  if "HTTP 404" not in str(exc):
                      raise
                  remote_file = {}
              built = Path(path).read_bytes()
              git_blob_sha = hashlib.sha1(
                  b"blob " + str(len(built)).encode("ascii") + bytes([0]) + built
              ).hexdigest()
              if git_blob_sha == remote_file.get("sha"):
                  continue
              blob = request(f"/repos/{repo}/git/blobs", "POST", {
                  "content": base64.b64encode(built).decode("ascii"),
                  "encoding": "base64",
              })
              changed.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
          if not changed:
              print("React Studio bundle, Tailwind CSS, and dependency lock are already current; no commit created.")
              sys.exit(0)

          # Contents API is not reliable for generated bundles over 1 MiB.
          # Publish via Git Database API and never force-update the main ref.
          current_ref = request(f"/repos/{repo}/git/ref/heads/main")
          parent_sha = current_ref["object"]["sha"]
          if parent_sha != expected:
              print(f"::warning::main advanced before bundle publication; no ref update (tested={expected}, current={parent_sha}).")
              sys.exit(0)
          parent_commit = request(f"/repos/{repo}/git/commits/{parent_sha}")
          tree = request(f"/repos/{repo}/git/trees", "POST", {
              "base_tree": parent_commit["tree"]["sha"],
              "tree": changed,
          })
          new_commit = request(f"/repos/{repo}/git/commits", "POST", {
              "message": "build: publish verified React 19 Studio bundle [skip ci]",
              "tree": tree["sha"],
              "parents": [parent_sha],
          })
          current_ref = request(f"/repos/{repo}/git/ref/heads/main")
          if current_ref["object"]["sha"] != expected:
              print("::warning::main advanced during bundle publication; generated blob is unreferenced, ref update skipped.")
              sys.exit(0)
          updated = request(f"/repos/{repo}/git/refs/heads/main", "PATCH", {
              "sha": new_commit["sha"], "force": False,
          })
          print(f"Published verified React Studio bundle and Tailwind CSS: {updated['object']['sha']}")
          PY
