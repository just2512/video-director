name: AI Director regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ai-director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version
      - run: python -m playwright install chromium
      - run: python -m compileall video_director webui
      # Full regression is authoritative; retain the historical file markers because
      # the bulk-management contract test verifies these regression gates remain represented.
      # tests/test_ai_director_first_class.py
      # tests/test_director_control_plane.py
      # tests/test_director_unified_inputs.py
      # tests/test_bulk_management.py
      # tests/test_director_failure_recovery.py
      # tests/test_frontend_duplicate_controls.py
      # tests/test_action_registry.py
      # tests/test_ui_action_audit.py
      # tests/test_mpt_user_flow.py
      - run: pytest -q
      - run: |
          for f in webui/static/js/*.js third_party/huashu-art-motion/clip/lib/*.js third_party/huashu-art-motion/clip/clips/*.js; do
            node --check "$f"
          done
