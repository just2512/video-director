name: AI Director regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Keep only the latest full regression run for a given PR/ref. Each run installs
# Chromium and executes the full pytest suite, so superseded commits should not
# compete with the head commit's browser/render checks.
concurrency:
  group: ai-director-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Ensure FFmpeg and the Chinese subtitle font
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          if ! command -v fc-list >/dev/null 2>&1 || ! fc-list : family | grep -Eiq 'WenQuanYi Micro Hei'; then
            missing+=(fonts-wqy-microhei)
          fi
          if (("${#missing[@]}")); then
            # Bound network stalls before the test suite. Do not silently continue
            # if a required render dependency is genuinely absent.
            sudo timeout 120s apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
            sudo timeout 180s apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 install -y "${missing[@]}"
          else
            echo "FFmpeg and WenQuanYi Micro Hei are already installed; skipping apt network access."
          fi
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall video_director webui
      - name: Run test suite and retain JUnit report
        run: pytest -q --junitxml=junit.xml
      - name: Check JavaScript syntax (run even when tests fail)
        if: always()
        run: |
          for f in webui/static/js/*.js; do
            node --check "$f"
          done
          for f in $(find third_party/huashu-art-motion/clip -name '*.js'); do
            node --check "$f"
          done
          node --check third_party/huashu/huashu_motion_bundle.js

      - name: Upload test reports and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-director-test-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            junit.xml
            test-results/**
            playwright-report/**
            artifacts/**
