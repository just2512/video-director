name: AI Director regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/unified-director-agent-loop"]

# Do not interrupt a running full regression. A newer push may replace the
# single pending run, but an active browser/render suite must finish and report.
permissions:
  contents: write

concurrency:
  group: ai-director-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  ai-director:
    # Self-hosted runner: WSL2 Ubuntu on the local Windows machine
    # (D:\WSL\Ubuntu). Kept online by the WSLUbuntuKeepAlive scheduled task.
    runs-on: [self-hosted, linux, x64]
    # Browser traces must land inside the workspace so upload-artifact actually
    # retains them; pytest's per-test tmp_path lives outside the upload globs.
    env:
      VIDEO_DIRECTOR_TEST_RESULTS: ${{ github.workspace }}/test-results
      # Python 3.11 is preinstalled on the runner image via Miniforge
      # (conda env py311), because setup-python's GitHub-hosted tarball
      # download is unreliable over the local network. Everything python
      # goes through this interpreter.
      PY311_BIN: /home/actions/miniforge3/envs/py311/bin
    steps:
      # This self-hosted WSL runner has intermittently lost GitHub TLS streams
      # during checkout. Force HTTP/1.1 before checkout instead of allowing Git
      # to negotiate the flaky transport path; this does not alter app/runtime traffic.
      - name: Configure Git transport for the self-hosted runner
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          git config --global --get http.version
      - name: Checkout source revision
        id: checkout
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/checkout@v4
      - name: Verify and recover exact source revision
        id: ensure_checkout
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::Checkout did not create a Git worktree."
            exit 1
          fi
          if [ "$(git rev-parse HEAD 2>/dev/null || true)" != "$expected" ]; then
            recovered=false
            for attempt in 1 2 3 4 5; do
              echo "Recovering exact workflow revision (attempt $attempt/5)."
              if timeout 45s git -c http.version=HTTP/1.1 fetch --no-tags --depth=1 \
                "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$expected"; then
                git checkout --force --detach FETCH_HEAD
                recovered=true
                break
              fi
              sleep "$((attempt * 3))"
            done
            if [ "$recovered" != true ]; then
              echo "::error::Unable to fetch the exact workflow SHA; refusing to test stale workspace contents."
              exit 1
            fi
          fi
          git reset --hard "$expected"
          git clean -ffdx
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Checkout verification failed: expected $expected, got $actual."
            exit 1
          fi
          echo "Verified source revision: $actual"
      - name: Verify pinned Python 3.11 interpreter
        if: steps.ensure_checkout.outcome == 'success'
        run: |
          "$PY311_BIN/python3.11" --version
          "$PY311_BIN/python3.11" -m pip --version
      - run: '"$PY311_BIN/python3.11" -m pip install --upgrade pip'
        if: steps.ensure_checkout.outcome == 'success'
      - run: '"$PY311_BIN/python3.11" -m pip install -r requirements.txt'
        if: steps.ensure_checkout.outcome == 'success'
      - name: Ensure FFmpeg and the Chinese subtitle font
        if: steps.ensure_checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
          if ! command -v fc-list >/dev/null 2>&1 || ! fc-list : family | grep -Eiq 'WenQuanYi Micro Hei'; then
            missing+=(fonts-wqy-microhei)
          fi
          if (("${#missing[@]}")); then
            # Bound network stalls before the test suite. Do not silently continue
            # if a required render dependency is genuinely absent.
            sudo timeout 120s apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
            # FFmpeg pulls a large codec dependency graph on Ubuntu 24.04.
            # Skip recommended packages and allow a bounded but realistic download window.
            sudo timeout 480s apt-get \
              -o Acquire::Retries=1 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 install --no-install-recommends -y "${missing[@]}"
          else
            echo "FFmpeg and WenQuanYi Micro Hei are already installed; skipping apt network access."
          fi
      # Chromium browser binaries live in the actions user's Playwright cache
      # (~/.cache/ms-playwright); system .so deps are preinstalled on the
      # runner image. Browser-only download keeps this step unprivileged.
      - run: '"$PY311_BIN/python3.11" -m playwright install chromium'
        if: steps.ensure_checkout.outcome == 'success'
      - run: '"$PY311_BIN/python3.11" -m compileall video_director webui'
        if: steps.ensure_checkout.outcome == 'success'
      - name: Typecheck React 19 / TypeScript render and timeline contracts
        if: always() && steps.ensure_checkout.outcome == 'success'
        working-directory: remotion_runtime
        run: |
          npm install --no-package-lock
          npm run typecheck
      - name: Build the React 19 Studio canvas inspector
        if: always()
        working-directory: remotion_runtime
        run: npm run build:studio
      - name: Run test suite and retain JUnit report
        if: always() && steps.ensure_checkout.outcome == 'success'
        run: '"$PY311_BIN/python3.11" -m pytest -q --junitxml=junit.xml'
      - name: Check JavaScript syntax (run even when tests fail)
        if: always() && steps.ensure_checkout.outcome == 'success'
        run: |
          for f in webui/static/js/*.js; do
            node --check "$f"
          done
          for f in $(find third_party/huashu-art-motion/clip -name '*.js'); do
            node --check "$f"
          done
          node --check third_party/huashu/huashu_motion_bundle.js

      - name: Upload test reports and browser traces
        if: always() && steps.ensure_checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ai-director-test-artifacts
          if-no-files-found: warn
          retention-days: 14
          path: |
            junit.xml
            test-results/**
            webui/static/js/film-studio-react.js
            playwright-report/**
            artifacts/**

      # The browser serves the checked-in bundle, not an ephemeral build directory.
      # Publish only if all checks succeeded and main has not advanced since checkout.
      # A GitHub-token push intentionally does not fan out another workflow run.
      - name: Publish verified React Studio bundle to main
        if: success() && steps.ensure_checkout.outcome == 'success'
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::warning::main advanced during verification; bundle was retained in the workflow artifact and not pushed over newer code."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/static/js/film-studio-react.js
          if git diff --cached --quiet; then
            echo "React Studio bundle unchanged."
            exit 0
          fi
          git commit -m "build: publish verified React 19 Studio bundle"
          git push origin HEAD:main
